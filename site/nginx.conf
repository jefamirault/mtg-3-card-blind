# 3cb.jefamirault.com — the public 3 Card Blind site (pre-certbot).
# Install as /etc/nginx/sites-available/3cb.jefamirault.com, link it into sites-enabled, then
# `sudo nginx -t && sudo systemctl reload nginx`. Once DNS points here:
#   sudo certbot --nginx -d 3cb.jefamirault.com
# No www record, so no www block. Needs /etc/nginx/snippets/security-headers.conf (the launch
# skill installs it once per droplet).
server {
    listen 80;
    listen [::]:80;
    server_name 3cb.jefamirault.com;

    root /var/www/3cb;
    index index.html;

    access_log /var/log/nginx/3cb_access.log;
    error_log  /var/log/nginx/3cb_error.log warn;

    include snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # The request queue (site/requests/server.js, a systemd user unit of the deploy user).
    location ^~ /api/requests {
        proxy_pass http://127.0.0.1:4581;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        client_max_body_size 16k;
    }

    # No cache-busting: the page and the exported results are checked on every load.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;   # re-include: this block sets add_header
    }
    location ^~ /data/ {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
    }

    gzip on;
    gzip_types application/json text/css application/javascript;

    location ~ /\. {
        deny all;
    }
}
