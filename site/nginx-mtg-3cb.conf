# 3 Card Blind at https://mtg.jefamirault.com/3cb/ (the MTG apps each live under a path there).
# Install as /etc/nginx/snippets/mtg-3cb.conf and include it in the mtg.jefamirault.com server
# block (the TLS one): `include snippets/mtg-3cb.conf;`. The site's files are in /var/www/3cb, not
# under /var/www/mtg: that folder is the creature type lines app's, and its deploy mirrors it.

location = /3cb {
    return 301 /3cb/;
}

# The exported site. ^~ keeps the server's regex locations (its .json caching) off these files:
# the page and the results are checked on every load, since nothing busts caches.
location ^~ /3cb/ {
    root /var/www;              # /3cb/x is /var/www/3cb/x
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    include snippets/security-headers.conf;   # re-include: this block sets add_header
}

# The request queue (site/requests/server.js, the deploy user's systemd unit 3cb-requests).
location ^~ /3cb/api/requests {
    proxy_pass http://127.0.0.1:4581/api/requests;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
}
